<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("Agri Supply Chain MVP") }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-green-700">🌱 AgriChain MVP</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/docs" class="text-sm text-gray-600 hover:text-green-700">API Docs</a>
                    <a href="/dashboard" class="text-sm text-gray-600 hover:text-green-700">Dashboard</a>
                    <a href="/reviews/ui" class="text-sm text-gray-600 hover:text-green-700">Reviews</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            Agri Supply Chain Blockchain MVP - Research Prototype
        </div>
    </footer>
</body>
</html>
